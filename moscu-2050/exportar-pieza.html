<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Exportar pieza</title>
  <!-- Herramienta interna: muestra una sola pieza de campaña a pantalla completa
       para exportarla como imagen. Uso: exportar-pieza.html?i=0&lang=ru (i de 0 a 4; lang ru o en). -->
  <script>
    document.documentElement.lang = new URLSearchParams(location.search).get("lang") === "es" ? "es" : "ru";
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    html, body { margin: 0; background: #111; overflow: hidden; }
    #lienzo { width: 100vw; height: 125vw; }
    #lienzo .pieza { width: 100%; height: 100%; aspect-ratio: auto; cursor: default; }
    #lienzo .pieza:hover { transform: none; box-shadow: none; }
  </style>
</head>
<body>
  <div id="lienzo"></div>
  <script type="module">
    const { piezaHTML } = await import("./js/modules/campana.js");
    const { PIEZAS } = await import("./js/data/contenido.js");
    const i = Number(new URLSearchParams(location.search).get("i") || 0);
    document.getElementById("lienzo").innerHTML = piezaHTML(PIEZAS[i], i, "div", "");
    const foto = document.querySelector(".pieza__foto");
    await Promise.all([document.fonts.ready, foto.decode().catch(() => {})]);
    document.body.setAttribute("data-listo", "1");
  </script>
</body>
</html>
